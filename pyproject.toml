[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-option-pricer"
dynamic = ["version"]
description = "Fourier option pricing (COS, Carr-Madan FFT, FRFT, Hilbert, PROJ) for 22 characteristic-function models, with exotics, Greeks, and calibration."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nigel Li", email = "nigelli676@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.10",
    "pyfeng>=0.4.0",
    # foureng never imports statsmodels, but pyfeng/util.py does at import
    # time without declaring it. Remove once pyfeng declares it itself.
    "statsmodels>=0.14",
]
keywords = [
    "quant-finance",
    "option-pricing",
    "derivatives",
    "fourier",
    "carr-madan",
    "cos-method",
    "characteristic-function",
    "heston",
    "levy",
    "exotic-options",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "pandas>=2.0"]
test = ["pytest>=7.4", "pytest-cov>=4.0", "hypothesis>=6.112", "pandas>=2.0", "mpmath>=1.3"]
notebook = ["jupyter>=1.0", "nbformat>=5.10", "ipykernel>=6.0", "pandas>=2.0", "matplotlib>=3.7"]
typecheck = ["mypy>=1.10"]
bench = ["pyperf>=2.7"]
dev = [
    "fourier-option-pricer[viz,test,notebook,typecheck,bench]",
    "nbmake>=1.5",
    "build",
    "twine",
    "ruff",
]

[project.urls]
Homepage      = "https://github.com/nl2992/fourier-option-pricer"
Documentation = "https://github.com/nl2992/fourier-option-pricer/tree/main/docs"
Repository    = "https://github.com/nl2992/fourier-option-pricer"
Issues        = "https://github.com/nl2992/fourier-option-pricer/issues"
Changelog     = "https://github.com/nl2992/fourier-option-pricer/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "foureng._version.__version__" }

[tool.setuptools.packages.find]
where   = ["."]
include = ["foureng*"]
exclude = ["tests*", "benchmarks*", "notebooks*"]

[tool.setuptools.package-data]
foureng = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that take more than a second (deselect with -m 'not slow')",
    "paper: published-paper replication or benchmark tests",
    "external_reference: expected values copied from paper tables or independent external sources",
    "derived_reference: expected values generated by an internal high-precision reference engine",
    "adapter: third-party wrapper parity tests, usually PyFENG",
    "numerical_stability: branch, truncation, grid, and convergence stress tests",
    "software_reference: numerical values from official software documentation such as MathWorks",
    "qualitative_figure: paper figure-parameter tests without exact numeric price targets",
]

[tool.coverage.run]
source = ["foureng"]
omit = ["foureng/experiments/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "E731"]

[tool.mypy]
# Analysis target must be >= 3.12 so mypy can parse the PEP 695 `type`
# statements in numpy >= 2.5 stubs. Runtime support for 3.10 is enforced by
# ruff (target-version py310) and the 3.10 leg of the CI test matrix.
python_version = "3.12"
files = ["foureng"]
exclude = "(^foureng/experiments/|^foureng/viz/)"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
