[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-option-pricer"
version = "0.18.0"
description = "Fourier-based European option pricing with Carr-Madan FFT, FRFT, and COS under characteristic-function models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nigel Li", email = "nigelli676@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "statsmodels>=0.14",
    "pyfeng>=0.4.0",
]
keywords = [
    "quant-finance",
    "option-pricing",
    "fourier",
    "carr-madan",
    "cos-method",
    "heston",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-cov>=4.0", "hypothesis>=6.112"]
notebook = ["jupyter>=1.0", "nbformat>=5.10", "ipykernel>=6.0", "pandas>=2.0"]
typecheck = ["mypy>=1.10"]
bench = ["pyperf>=2.7"]
dev  = ["pytest>=7.4", "pytest-cov>=4.0", "hypothesis>=6.112", "nbmake>=1.5", "jupyter>=1.0", "nbformat>=5.10", "ipykernel>=6.0", "build", "twine", "ruff", "mypy>=1.10", "pyperf>=2.7"]

[project.urls]
Homepage   = "https://github.com/nl2992/fourier-option-pricer"
Repository = "https://github.com/nl2992/fourier-option-pricer"
Issues     = "https://github.com/nl2992/fourier-option-pricer/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["foureng*"]
exclude = ["tests*", "benchmarks*", "notebooks*"]

[tool.setuptools]
license-files = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that take more than a second (deselect with -m 'not slow')",
    "paper: published-paper replication or benchmark tests",
    "external_reference: expected values copied from paper tables or independent external sources",
    "derived_reference: expected values generated by an internal high-precision reference engine",
    "adapter: third-party wrapper parity tests, usually PyFENG",
    "numerical_stability: branch, truncation, grid, and convergence stress tests",
    "software_reference: numerical values from official software documentation such as MathWorks",
    "qualitative_figure: paper figure-parameter tests without exact numeric price targets",
]

[tool.coverage.run]
source = ["foureng"]
omit = ["foureng/experiments/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "E731"]

[tool.mypy]
# Analysis target must be >= 3.12 so mypy can parse the PEP 695 `type`
# statements in numpy >= 2.5 stubs. Runtime support for 3.10 is enforced by
# ruff (target-version py310) and the 3.10 leg of the CI test matrix.
python_version = "3.12"
files = ["foureng"]
exclude = "(^foureng/experiments/|^foureng/viz/)"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
