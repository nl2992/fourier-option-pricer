name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check foureng/

      - name: ruff format check
        run: ruff format --check foureng/

  test:
    name: Test Python ${{ matrix.python-version }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            deps: minimum
          - python-version: "3.11"
            deps: latest
          - python-version: "3.12"
            deps: latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (minimum deps)
        if: matrix.deps == 'minimum'
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/minimum.txt -e ".[test]"

      - name: Install (latest deps)
        if: matrix.deps == 'latest'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Fast tests with coverage
        run: pytest -q --tb=short -m "not slow" --cov=foureng --cov-report=term-missing --cov-fail-under=60

  paper-tests:
    name: Paper/reference tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Paper tests without slow stress cases
        run: pytest -q --tb=short -m "paper and not slow"

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
