name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyfeng>=0.3.0"
          pip install -e ".[test]"

      - name: Verify runtime dependencies
        run: |
          python - <<'PY'
          import importlib.metadata as m
          import foureng
          import pyfeng

          print("foureng", foureng.__version__)
          print("pyfeng", m.version("pyfeng"))
          print("numpy", m.version("numpy"))
          print("scipy", m.version("scipy"))
          print("statsmodels", m.version("statsmodels"))
          PY

      - name: Run tests
        run: pytest tests/ -q --tb=short -m "not slow"
