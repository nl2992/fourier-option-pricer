name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check foureng/ tests/

      - name: ruff format check
        run: ruff format --check foureng/ tests/

  typecheck:
    name: Type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[typecheck]"

      - name: mypy
        run: python -m mypy foureng

  test:
    name: Test Python ${{ matrix.python-version }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            deps: minimum
          - python-version: "3.11"
            deps: latest
          - python-version: "3.12"
            deps: latest
          - python-version: "3.13"
            deps: latest
          - python-version: "3.14"
            deps: latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (minimum deps)
        if: matrix.deps == 'minimum'
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/minimum.txt -e ".[test]"

      - name: Install (latest deps)
        if: matrix.deps == 'latest'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Fast tests with coverage
        run: pytest -q --tb=short -m "not slow" --cov=foureng --cov-report=term-missing --cov-fail-under=70

  paper-tests:
    name: Paper/reference tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Paper tests without slow stress cases
        run: pytest -q --tb=short -m "paper and not slow"

  package:
    name: Build & verify distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Verify distribution contents
        run: |
          unzip -l dist/*.whl | grep -q "foureng/py.typed"
          unzip -l dist/*.whl | grep -q "licenses/LICENSE"
          tar tzf dist/*.tar.gz | grep -q "/LICENSE$"

      - name: Smoke-test the wheel with core dependencies only
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "import foureng as fe; print(fe.__version__); print(fe.price_strip('heston', 'cos_improved', [90.0, 100.0, 110.0], fe.ForwardSpec(S0=100, r=0.01, q=0.0, T=1.0), fe.HestonParams(kappa=4.0, theta=0.25, nu=1.0, rho=-0.5, v0=0.04)))"
