name: Slow tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

jobs:
  slow:
    name: Full test suite (including slow)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,notebook]"

      - name: All tests
        run: pytest -q --tb=short --cov=foureng --cov-report=term-missing
