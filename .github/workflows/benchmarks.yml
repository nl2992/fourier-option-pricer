name: Benchmarks

on:
  workflow_dispatch:

jobs:
  benchmark:
    name: Canonical pyperf benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[bench]"

      - name: Run pyperf benchmarks
        run: |
          mkdir -p benchmarks/results
          rm -f benchmarks/results/pyperf.json
          python benchmarks/pyperf_canonical_cases.py -o benchmarks/results/pyperf.json

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyperf-benchmarks
          path: benchmarks/results/pyperf.json
