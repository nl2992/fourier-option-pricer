<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f3b64; }
      .subtitle { font: 700 18px Arial, sans-serif; fill: #355c8a; }
      .label { font: 16px Arial, sans-serif; fill: #314559; }
      .small { font: 14px Arial, sans-serif; fill: #4b627b; }
      .mono { font: 600 21px Menlo, Consolas, monospace; fill: #203245; }
      .box { fill: #fbfdff; stroke: #c8d8ea; stroke-width: 2; rx: 18; }
      .grid { stroke: #e8eef5; stroke-width: 1; }
      .axis { stroke: #7e95ab; stroke-width: 2; }
      .plain { fill: none; stroke: #5a86b8; stroke-width: 4; stroke-dasharray: 10 8; }
      .filtered { fill: none; stroke: #a9d2eb; stroke-width: 5; }
      .target { fill: none; stroke: #1f2f3d; stroke-width: 4; }
      .marker { stroke: #9eb5cb; stroke-width: 2; stroke-dasharray: 4 6; }
      .accent { fill: #eef5fb; stroke: #c8d8ea; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>

  <rect x="18" y="18" width="1164" height="324" fill="#ffffff" stroke="#d7e4f0" stroke-width="2" rx="20"/>

  <text x="38" y="54" class="title">Adaptive filtered-COS: project innovation over baseline COS</text>
  <text x="38" y="82" class="label">Literature inspiration: spectral damping can reduce residual ringing.</text>
  <text x="38" y="106" class="label">Project extension: keep the same COS machinery, then add damping plus deterministic candidate selection.</text>

  <rect x="38" y="128" width="540" height="154" class="box"/>
  <rect x="622" y="128" width="540" height="154" class="box"/>

  <text x="58" y="156" class="subtitle">1. Why filtering helps near a payoff kink</text>
  <text x="642" y="156" class="subtitle">2. What changes in the final series sum</text>

  <line x1="88" y1="250" x2="520" y2="250" class="axis"/>
  <line x1="88" y1="250" x2="88" y2="172" class="axis"/>
  <line x1="302" y1="168" x2="302" y2="254" class="marker"/>
  <line x1="88" y1="230" x2="520" y2="230" class="grid"/>
  <line x1="88" y1="210" x2="520" y2="210" class="grid"/>
  <line x1="88" y1="190" x2="520" y2="190" class="grid"/>
  <text x="96" y="272" class="small">local log-moneyness</text>
  <text x="26" y="218" transform="rotate(-90 26 218)" class="small">series contribution</text>

  <path d="M 96 248 C 160 248, 200 248, 234 247 C 258 243, 270 236, 284 253 C 296 265, 312 214, 328 208 C 348 204, 383 185, 434 147 C 466 124, 494 103, 518 88" class="plain"/>
  <path d="M 96 248 C 178 248, 220 248, 262 247 C 281 247, 294 245, 304 238 C 320 220, 336 206, 352 198 C 374 185, 405 168, 438 145 C 469 123, 494 103, 518 88" class="filtered"/>
  <path d="M 96 248 L 290 248 L 302 242 L 320 220 L 340 198 L 518 88" class="target"/>

  <line x1="352" y1="176" x2="386" y2="176" class="target"/>
  <text x="394" y="181" class="small">target payoff shape</text>
  <line x1="352" y1="198" x2="386" y2="198" class="plain"/>
  <text x="394" y="203" class="small">plain COS ringing</text>
  <line x1="352" y1="220" x2="386" y2="220" class="filtered"/>
  <text x="394" y="225" class="small">filtered COS</text>

  <line x1="672" y1="250" x2="1104" y2="250" class="axis"/>
  <line x1="672" y1="250" x2="672" y2="172" class="axis"/>
  <line x1="672" y1="230" x2="1104" y2="230" class="grid"/>
  <line x1="672" y1="210" x2="1104" y2="210" class="grid"/>
  <line x1="672" y1="190" x2="1104" y2="190" class="grid"/>
  <text x="810" y="272" class="small">COS mode k</text>
  <text x="612" y="218" transform="rotate(-90 612 218)" class="small">relative weight</text>

  <path d="M 682 182 C 730 193, 776 209, 820 223 C 862 235, 906 240, 952 239 C 992 238, 1026 220, 1054 218 C 1078 217, 1093 224, 1100 232" class="plain"/>
  <path d="M 682 182 C 728 196, 776 212, 822 226 C 872 239, 921 246, 970 249 C 1018 250, 1060 250, 1100 250" class="filtered"/>

  <line x1="838" y1="182" x2="890" y2="182" class="plain"/>
  <text x="898" y="187" class="small">plain COS tail modes</text>
  <line x1="838" y1="204" x2="890" y2="204" class="filtered"/>
  <text x="898" y="209" class="small">after spectral damping</text>

  <rect x="38" y="296" width="1124" height="28" class="accent"/>
  <text x="56" y="315" class="small">Project innovation = filtered COS layer + deterministic search over (grid policy, filter) candidates + guaranteed unfiltered Junike fallback.</text>

  <text x="56" y="349" class="mono">plain COS: price ~= disc * sum_k A_k * V_k</text>
  <text x="654" y="349" class="mono">project extension: price ~= disc * sum_k sigma_k * A_k * V_k</text>
</svg>
