<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <defs>
    <style>
      .title { font: 700 25px Arial, sans-serif; fill: #274777; }
      .subtitle { font: 700 17px Arial, sans-serif; fill: #355c8a; }
      .label { font: 15px Arial, sans-serif; fill: #314559; }
      .small { font: 13px Arial, sans-serif; fill: #516883; }
      .formula { font: italic 24px Georgia, serif; fill: #1f2f3d; }
      .box { fill: #fbfdff; stroke: #c8d8ea; stroke-width: 2; rx: 18; }
      .soft { fill: #f4f8fc; stroke: #d5e2ef; stroke-width: 1.5; rx: 14; }
      .grid { stroke: #e8eef5; stroke-width: 1; }
      .axis { stroke: #7e95ab; stroke-width: 2; }
      .plain { fill: none; stroke: #5a86b8; stroke-width: 4; stroke-dasharray: 10 8; }
      .filtered { fill: none; stroke: #a9d2eb; stroke-width: 5; }
      .target { fill: none; stroke: #1f2f3d; stroke-width: 4; }
      .marker { stroke: #9eb5cb; stroke-width: 2; stroke-dasharray: 4 6; }
    </style>
  </defs>

  <rect x="20" y="20" width="860" height="580" fill="#ffffff" stroke="#d7e4f0" stroke-width="2" rx="22"/>

  <text x="44" y="58" class="title">Adaptive filtered-COS: what changes</text>
  <text x="44" y="86" class="label">Same COS ingredients, but tail modes are damped and candidate policies are selected adaptively.</text>

  <rect x="44" y="112" width="812" height="200" class="box"/>
  <text x="66" y="140" class="subtitle">1. Near the payoff kink</text>

  <line x1="110" y1="256" x2="718" y2="256" class="axis"/>
  <line x1="110" y1="256" x2="110" y2="164" class="axis"/>
  <line x1="408" y1="160" x2="408" y2="260" class="marker"/>
  <line x1="110" y1="232" x2="718" y2="232" class="grid"/>
  <line x1="110" y1="208" x2="718" y2="208" class="grid"/>
  <line x1="110" y1="184" x2="718" y2="184" class="grid"/>
  <text x="120" y="286" class="small">local log-moneyness</text>
  <text x="54" y="224" transform="rotate(-90 54 224)" class="small">series contribution</text>

  <path d="M 120 252 C 200 252, 252 252, 302 251 C 334 248, 354 240, 372 258 C 386 270, 408 212, 430 204 C 458 196, 506 172, 562 128 C 604 96, 640 69, 688 38" class="plain"/>
  <path d="M 120 252 C 222 252, 278 252, 326 251 C 350 251, 372 246, 388 236 C 410 216, 432 198, 452 188 C 484 170, 522 150, 568 122 C 608 96, 642 70, 688 38" class="filtered"/>
  <path d="M 120 252 L 390 252 L 408 242 L 432 214 L 456 188 L 688 38" class="target"/>

  <line x1="594" y1="164" x2="628" y2="164" class="target"/>
  <text x="638" y="169" class="small">target</text>
  <line x1="594" y1="188" x2="628" y2="188" class="plain"/>
  <text x="638" y="193" class="small">plain COS</text>
  <line x1="594" y1="212" x2="628" y2="212" class="filtered"/>
  <text x="638" y="217" class="small">filtered COS</text>

  <rect x="44" y="332" width="812" height="170" class="box"/>
  <text x="66" y="360" class="subtitle">2. In the mode weights</text>

  <line x1="110" y1="456" x2="718" y2="456" class="axis"/>
  <line x1="110" y1="456" x2="110" y2="380" class="axis"/>
  <line x1="110" y1="432" x2="718" y2="432" class="grid"/>
  <line x1="110" y1="408" x2="718" y2="408" class="grid"/>
  <line x1="110" y1="384" x2="718" y2="384" class="grid"/>
  <text x="330" y="484" class="small">COS mode k</text>
  <text x="54" y="424" transform="rotate(-90 54 424)" class="small">relative weight</text>

  <path d="M 124 392 C 194 408, 266 430, 332 446 C 392 460, 458 468, 522 468 C 584 468, 632 444, 672 440 C 694 438, 708 442, 718 450" class="plain"/>
  <path d="M 124 392 C 194 412, 262 432, 328 446 C 392 458, 458 468, 522 474 C 588 478, 652 480, 718 480" class="filtered"/>

  <line x1="580" y1="392" x2="626" y2="392" class="plain"/>
  <text x="636" y="397" class="small">plain tail modes</text>
  <line x1="580" y1="416" x2="626" y2="416" class="filtered"/>
  <text x="636" y="421" class="small">after damping</text>

  <rect x="44" y="524" width="390" height="50" class="soft"/>
  <rect x="466" y="524" width="390" height="50" class="soft"/>

  <text x="66" y="546" class="subtitle">Baseline COS</text>
  <text x="66" y="568" class="formula">price ≈ disc · Σ Aₖ Vₖ</text>

  <text x="488" y="546" class="subtitle">Project extension</text>
  <text x="488" y="568" class="formula">price ≈ disc · Σ σₖ Aₖ Vₖ</text>
</svg>
