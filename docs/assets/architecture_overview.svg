<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="860" viewBox="0 0 1680 860" role="img" aria-labelledby="title desc">
  <title id="title">fourier-option-pricer architecture overview</title>
  <desc id="desc">A simplified four-stage architecture diagram for the fourier-option-pricer package.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcfdff"/>
      <stop offset="100%" stop-color="#f7f9fc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#17345b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#98adc9"/>
    </marker>
    <style>
      .canvas { fill: url(#bg); stroke: #d8e2ef; stroke-width: 2; }
      .title { font: 700 34px 'Aptos', 'Segoe UI', Arial, sans-serif; fill: #193a67; }
      .subtitle { font: 17px 'Aptos', 'Segoe UI', Arial, sans-serif; fill: #627895; }
      .panel { stroke-width: 1.6; rx: 24; filter: url(#shadow); }
      .slate { fill: #f8fafc; stroke: #d7e2ef; }
      .blue { fill: #eef4fb; stroke: #cad9ed; }
      .green { fill: #eef9f4; stroke: #bfe1d0; }
      .violet { fill: #f6f2ff; stroke: #d7caf5; }
      .footer { fill: #fff6ec; stroke: #edcfaa; }
      .panel-title { font: 700 20px 'Aptos', 'Segoe UI', Arial, sans-serif; fill: #193a67; }
      .panel-title-green { font: 700 20px 'Aptos', 'Segoe UI', Arial, sans-serif; fill: #1d6a53; }
      .panel-title-violet { font: 700 20px 'Aptos', 'Segoe UI', Arial, sans-serif; fill: #64469a; }
      .panel-title-footer { font: 700 18px 'Aptos', 'Segoe UI', Arial, sans-serif; fill: #8a5312; }
      .section { font: 700 15px 'Aptos', 'Segoe UI', Arial, sans-serif; fill: #28496f; }
      .section-green { font: 700 15px 'Aptos', 'Segoe UI', Arial, sans-serif; fill: #1d6a53; }
      .body { font: 14px 'Aptos', 'Segoe UI', Arial, sans-serif; fill: #526984; }
      .small { font: 13px 'Aptos', 'Segoe UI', Arial, sans-serif; fill: #647992; }
      .mono { font: 600 18px Menlo, Consolas, monospace; fill: #1d3d69; }
      .card { fill: #ffffff; stroke: #d6e0ee; stroke-width: 1.3; rx: 16; }
      .arrow { fill: none; stroke: #98adc9; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="canvas" x="24" y="24" width="1632" height="812" rx="28"/>

  <text class="title" x="60" y="84">fourier-option-pricer architecture</text>
  <text class="subtitle" x="60" y="114">A simpler package map: entry points feed one public API, one routing core, one pricing stack, and one output layer.</text>

  <path class="arrow" d="M410 420 L470 420"/>
  <path class="arrow" d="M806 420 L866 420"/>
  <path class="arrow" d="M1202 420 L1262 420"/>

  <!-- stage 1 -->
  <rect class="panel slate" x="60" y="160" width="350" height="560" rx="24"/>
  <text class="panel-title" x="88" y="202">1. Entry points</text>
  <text class="small" x="88" y="226">How users, graders, and developers first meet the repo</text>

  <rect class="card" x="88" y="258" width="294" height="68" rx="16"/>
  <text class="section" x="108" y="287">README + quick start</text>
  <text class="body" x="108" y="309">installation, import, first strip</text>

  <rect class="card" x="88" y="346" width="294" height="68" rx="16"/>
  <text class="section" x="108" y="375">notebooks/</text>
  <text class="body" x="108" y="397">demo, paper replay, research</text>

  <rect class="card" x="88" y="434" width="294" height="68" rx="16"/>
  <text class="section" x="108" y="463">tests + benchmarks/</text>
  <text class="body" x="108" y="485">validation cases and runtime evidence</text>

  <rect class="card" x="88" y="522" width="294" height="68" rx="16"/>
  <text class="section" x="108" y="551">docs + appendix</text>
  <text class="body" x="108" y="573">reporting and methodological detail</text>

  <!-- stage 2 -->
  <rect class="panel blue" x="456" y="160" width="350" height="560" rx="24"/>
  <text class="panel-title" x="484" y="202">2. Public API + routing</text>
  <text class="small" x="484" y="226">One interface, then one dispatcher</text>

  <rect class="card" x="484" y="258" width="294" height="86" rx="16"/>
  <text class="mono" x="504" y="290">import foureng as fe</text>
  <text class="body" x="504" y="318">ForwardSpec, parameter dataclasses,</text>
  <text class="body" x="504" y="338">helpers, exposed pricers</text>

  <rect class="card" x="484" y="366" width="294" height="86" rx="16"/>
  <text class="mono" x="504" y="398">price_strip(...)</text>
  <text class="body" x="504" y="426">switch engines without changing</text>
  <text class="body" x="504" y="446">model inputs or strike arrays</text>

  <rect class="card" x="484" y="474" width="294" height="96" rx="16"/>
  <text class="section" x="504" y="504">foureng/pipeline.py</text>
  <text class="body" x="504" y="532">dispatches model + method requests</text>
  <text class="body" x="504" y="552">applies improved-COS / filtered-COS selection</text>

  <rect class="card" x="484" y="590" width="294" height="96" rx="16"/>
  <text class="section" x="504" y="620">models/registry.py</text>
  <text class="body" x="504" y="648">maps labels to params, CF hooks, cumulants,</text>
  <text class="body" x="504" y="668">and backend capabilities</text>

  <!-- stage 3 -->
  <rect class="panel green" x="852" y="160" width="350" height="560" rx="24"/>
  <text class="panel-title-green" x="880" y="202">3. Pricing stack</text>
  <text class="small" x="880" y="226">Backends, engines, and shared numerics</text>

  <rect class="card" x="880" y="258" width="294" height="96" rx="16"/>
  <text class="section-green" x="900" y="288">Model backends</text>
  <text class="body" x="900" y="316">12 in-house characteristic-function models</text>
  <text class="body" x="900" y="336">8 PyFENG-backed adapters</text>

  <rect class="card" x="880" y="376" width="294" height="116" rx="16"/>
  <text class="section-green" x="900" y="406">Fourier engines</text>
  <text class="body" x="900" y="434">COS, improved COS, filtered COS</text>
  <text class="body" x="900" y="454">Carr-Madan FFT, FRFT, Lewis</text>
  <text class="body" x="900" y="474">pyfeng_fft on supported backends</text>

  <rect class="card" x="880" y="514" width="294" height="116" rx="16"/>
  <text class="section-green" x="900" y="544">Shared numerics</text>
  <text class="body" x="900" y="572">grids, cumulants, spectral filters,</text>
  <text class="body" x="900" y="592">validity guards, experiment helpers</text>

  <!-- stage 4 -->
  <rect class="panel violet" x="1248" y="160" width="350" height="560" rx="24"/>
  <text class="panel-title-violet" x="1276" y="202">4. Features + outputs</text>
  <text class="small" x="1276" y="226">Everything above the kernel reuses the same base stack</text>

  <rect class="card" x="1276" y="258" width="294" height="68" rx="16"/>
  <text class="section" x="1296" y="287">Analytics</text>
  <text class="body" x="1296" y="309">iv/  -  greeks/  -  surface/  -  mc/</text>

  <rect class="card" x="1276" y="346" width="294" height="68" rx="16"/>
  <text class="section" x="1296" y="375">Validation</text>
  <text class="body" x="1296" y="397">tests/  -  benchmarks/  -  paper replications</text>

  <rect class="card" x="1276" y="434" width="294" height="68" rx="16"/>
  <text class="section" x="1296" y="463">Reporting</text>
  <text class="body" x="1296" y="485">docs/  -  notebooks/  -  appendix</text>

  <rect class="card" x="1276" y="522" width="294" height="108" rx="16"/>
  <text class="section" x="1296" y="552">Project message</text>
  <text class="body" x="1296" y="580">The repo is not a loose collection of notebooks.</text>
  <text class="body" x="1296" y="600">All validation and presentation layers sit on</text>
  <text class="body" x="1296" y="620">the same reusable pricing foundation.</text>

  <!-- footer -->
  <rect class="panel footer" x="60" y="744" width="1538" height="64" rx="20"/>
  <text class="panel-title-footer" x="88" y="784">Note</text>
  <text class="body" x="156" y="784">`lewis` = in-house inversion in `foureng/pricers/lewis.py`   -   `pyfeng_fft` = PyFENG-backed Lewis-style FFT bridge</text>
</svg>
